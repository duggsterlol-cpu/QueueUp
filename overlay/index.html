<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HamQueue Overlay</title>
<link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="stage" id="stage">
    <header class="oheader" id="oheader">
      <div class="title-wrap">
        <span class="title-bar"></span>
        <h1 id="otitle">NEXT UP</h1>
      </div>
      <span class="ocount" id="ocount">0</span>
    </header>

    <div class="rows" id="rows"></div>

    <div class="oempty" id="oempty">
      <span class="pulse-dot"></span>
      <span id="oemptytext">Queue is empty</span>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
